<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trishna: Climate-Smart Kisan Companion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            animation: {
              'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 12s linear infinite',
              'wiggle': 'wiggle 1s ease-in-out infinite',
              'sunbeam': 'sunbeam 20s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              },
              wiggle: {
                '0%, 100%': { transform: 'rotate(-3deg)' },
                '50%': { transform: 'rotate(3deg)' },
              },
              sunbeam: {
                '0%': { transform: 'rotate(0deg)' },
                '100%': { transform: 'rotate(360deg)' }
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        min-height: 100vh;
        transition: background 0.5s ease;
        position: relative;
        overflow-x: hidden;
      }
      
      /* Light Mode: Vibrant Day with Sunbeams */
      body {
        background: linear-gradient(135deg, #ecfccb 0%, #dcfce7 40%, #e0f2fe 100%);
        background-size: 200% 200%;
        animation: day-flow 15s ease infinite alternate;
      }
      
      /* Light mode: Rotating Sunbeams */
      body::before {
        content: "";
        position: fixed;
        top: -50%; left: -50%; width: 200%; height: 200%;
        background: repeating-conic-gradient(
          from 0deg,
          rgba(255, 255, 255, 0.4) 0deg 10deg,
          transparent 10deg 20deg
        );
        animation: sunbeam 60s linear infinite;
        pointer-events: none;
        z-index: -1;
        opacity: 0.3;
      }

      /* Light mode: Floating Particles */
      body::after {
        content: "";
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-image: 
            radial-gradient(circle, rgba(34, 197, 94, 0.2) 2px, transparent 2px),
            radial-gradient(circle, rgba(234, 179, 8, 0.15) 3px, transparent 3px);
        background-size: 100px 100px;
        animation: floating-dust 40s linear infinite;
        pointer-events: none;
        z-index: -1;
      }

      /* Dark Mode: Deep Mystical Night */
      html.dark body {
        background: linear-gradient(135deg, #020617 0%, #064e3b 40%, #111827 80%, #0f172a 100%);
        background-size: 300% 300%;
        animation: night-flow 25s ease infinite;
        color: #f0fdf4;
      }

      /* Dark mode: Stars - Overrides light mode pseudo-elements */
      html.dark body::before {
        background: 
            radial-gradient(1.5px 1.5px at 50px 100px, rgba(255,255,255,0.7), transparent),
            radial-gradient(1px 1px at 150px 200px, rgba(255,255,255,0.5), transparent),
            radial-gradient(2px 2px at 300px 50px, rgba(255,255,255,0.6), transparent);
        background-size: 550px 550px;
        animation: star-drift 120s linear infinite;
        opacity: 0.6;
        width: 100%; height: 100%; top: 0; left: 0;
      }

      /* Dark mode: Fireflies/Glow */
      html.dark body::after {
        background: 
            radial-gradient(circle at 20% 80%, rgba(74, 222, 128, 0.15), transparent 200px),
            radial-gradient(circle at 80% 20%, rgba(34, 197, 94, 0.1), transparent 300px);
        background-size: cover;
        filter: blur(20px);
        animation: glow-pulse 10s ease-in-out infinite alternate;
        opacity: 1;
      }

      @keyframes day-flow {
        0% { background-position: 0% 0%; }
        100% { background-position: 100% 100%; }
      }

      @keyframes night-flow {
        0% { background-position: 0% 20%; }
        50% { background-position: 100% 80%; }
        100% { background-position: 0% 20%; }
      }

      @keyframes floating-dust {
        0% { transform: translateY(0) translateX(0); }
        100% { transform: translateY(-100px) translateX(50px); }
      }

      @keyframes star-drift {
        0% { background-position: 0 0; }
        100% { background-position: -50px -100px; }
      }

      @keyframes glow-pulse {
        0% { opacity: 0.5; transform: scale(1); }
        50% { opacity: 0.8; transform: scale(1.1); }
        100% { opacity: 0.5; transform: scale(1); }
      }
      
      @keyframes sunbeam {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      /* Animations */
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes scaleIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }
      
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
      .animate-scale-in { animation: scaleIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

      /* Custom scrollbar */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
      html.dark ::-webkit-scrollbar-thumb { background: #334155; }
      html.dark ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",

    "@emailjs/browser": "https://esm.sh/@emailjs/browser@^4.3.0"
  }
}
</script>

</head>

</html>
